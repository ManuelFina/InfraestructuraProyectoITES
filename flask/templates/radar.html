<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecturas de Radar Ultrasonido</title>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f8f9fa;
      color: #222;
    }
    h1 {
      text-align: center;
      color: #007bff;
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      border-radius: 8px;
      overflow: hidden;
    }
    thead {
      background-color: #007bff;
      color: white;
    }
    th, td {
      padding: 10px 14px;
      text-align: left;
    }
    th {
      text-transform: uppercase;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
    tr:nth-child(even) {
      background-color: #f2f6fc;
    }
    tr:hover {
      background-color: #e9f1ff;
    }
    .muted {
      color: #555;
      font-size: 14px;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>📡 Últimas Lecturas</h1>

  <table id="tabla">
    <thead>
      <tr>
        <th>Hora</th>
        <th>Ángulo (°)</th>
        <th>Distancia (cm)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td colspan="3" style="text-align:center; color:#777;">Cargando...</td></tr>
    </tbody>
  </table>

  <p class="muted">Ultimas 15 lecturas.</p>

  <script>
    const API_URL = "/api/sensor/latest?limit=15";
    const tbody = document.querySelector("#tabla tbody");

    async function actualizar() {
      try {
        const res = await fetch(API_URL, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const datos = await res.json();

        if (!Array.isArray(datos) || !datos.length) {
          tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#777;">Sin datos</td></tr>`;
          return;
        }

        const filas = datos.map(d => {
          const hora = new Date(d.ts).toLocaleTimeString();
          const angulo = Number(d.angle ?? d.angle_deg ?? 0).toFixed(1);
          const distancia = Number(d.distance ?? d.distance_cm ?? 0).toFixed(1);
          return `
            <tr>
              <td>${hora}</td>
              <td>${angulo}</td>
              <td>${distancia}</td>
            </tr>
          `;
        }).join("");

        tbody.innerHTML = filas;
      } catch (e) {
        console.error("Error al actualizar:", e);
      }
    }

    actualizar();
    setInterval(actualizar, 1000);
  </script>
</body>
</html>
