<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar Ultrasónico</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a1929 0%, #1a2332 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: #e0e0e0;
    }

    header {
      background: rgba(0, 0, 0, 0.4);
      padding: 24px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    h1 {
      font-size: 1.8em;
      font-weight: 300;
      letter-spacing: 1px;
      color: #ffffff;
    }

    h2 {
      font-size: 1.2em;
      font-weight: 400;
      color: #b0b0b0;
      margin-bottom: 16px;
    }

    .container {
      display: flex;
      flex: 1;
      padding: 24px;
      gap: 24px;
      align-items: stretch;
    }

    .radar-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .radar-section h2 {
      text-align: center;
      margin-bottom: 16px;
    }

    .radar-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      padding: 20px;
    }

    #radarCanvas {
      max-width: 100%;
      max-height: 100%;
    }

    .data-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .data-section h2 {
      text-align: center;
      margin-bottom: 16px;
    }

    .table-container {
      flex: 1;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      position: sticky;
      top: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 10;
      backdrop-filter: blur(10px);
    }

    th {
      padding: 14px 16px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-weight: 500;
      text-transform: uppercase;
      font-size: 0.75em;
      letter-spacing: 0.5px;
      color: #9e9e9e;
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.9em;
    }

    tbody tr {
      transition: background 0.2s ease;
    }

    tbody tr:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .distance-cell {
      font-weight: 500;
      color: #4caf50;
      font-family: 'Courier New', monospace;
    }

    .angle-cell {
      color: #64b5f6;
      font-family: 'Courier New', monospace;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Sistema de Radar Ultrasónico</h1>
  </header>

  <div class="container">
    <div class="radar-section">
      <h2>Radar 180°</h2>
      <div class="radar-container">
        <canvas id="radarCanvas"></canvas>
      </div>
    </div>

    <div class="data-section">
      <h2>Datos de Medición</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Timestamp</th>
              <th>Ángulo</th>
              <th>Distancia</th>
            </tr>
          </thead>
          <tbody id="dataTable">
            <tr>
              <td colspan="3" style="text-align: center; padding: 30px; opacity: 0.4; color: #757575;">
                Esperando datos del sensor...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('radarCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const container = canvas.parentElement;
      const size = Math.min(container.clientWidth, container.clientHeight) * 0.9;
      canvas.width = size;
      canvas.height = size / 2 + 60;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // ===== Radar vars
    let currentAngle = 180;
    let scanDirection = -1;
    const maxDistance = 400;
    let detectedObjects = [];

    // ==== CONFIG DEL BARRIDO ====
    const SWEEP_MIN = 0;
    const SWEEP_MAX = 180;
    const SWEEP_STEP = 2;
    const FAN_WIDTH = 6;

    function deg2rad(deg) { return (deg * Math.PI) / 180; }

    function getGeom() {
      const w = canvas.width, h = canvas.height;
      const centerX = w / 2;

      const TOP_MARGIN  = 28;
      const BASE_MARGIN = 60;
      const centerY = h - BASE_MARGIN;

      const radius  = Math.min(w / 2 - 20, centerY - TOP_MARGIN);
      return { w, h, centerX, centerY, radius, TOP_MARGIN, BASE_MARGIN };
    }

    function beginSemiClip(g) {
      const { centerX, centerY, radius } = g;
      ctx.save();
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, Math.PI, 0, false);
      ctx.lineTo(centerX, centerY);
      ctx.closePath();
      ctx.clip();
    }
    function endClip() { ctx.restore(); }

    function wipeUnderBase(g) {
      ctx.clearRect(0, g.centerY, g.w, g.h - g.centerY);
    }

    // ===== Tabla fija: buffer circular de 15 filas
    const MAX_ROWS = 15;
    const ring = new Array(MAX_ROWS).fill(null);
    let writePtr = 0;

    function initTable() {
      const tbody = document.getElementById('dataTable');
      tbody.innerHTML = '';
      for (let i = 0; i < MAX_ROWS; i++) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>—</td>
          <td class="angle-cell">—</td>
          <td class="distance-cell">—</td>
        `;
        tbody.appendChild(tr);
      }
    }

    function redrawTable() {
      const tbody = document.getElementById('dataTable');
      const count = Math.min(writePtr, MAX_ROWS);

      for (let i = 0; i < MAX_ROWS; i++) {
        const row = tbody.rows[i];

        if (i < count) {
          const bufIdx = (writePtr - 1 - i + MAX_ROWS) % MAX_ROWS; // último arriba
          const e = ring[bufIdx];
          row.cells[0].textContent = e.timestamp;
          row.cells[1].textContent = `${e.angle}°`;
          row.cells[2].textContent = `${e.distance} cm`;
        } else {
          row.cells[0].textContent = '—';
          row.cells[1].textContent = '—';
          row.cells[2].textContent = '—';
        }
      }
    }

    // ===== Dibujo del radar
    function drawFrame() {
      const g = getGeom();
      ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
      ctx.fillRect(0, 0, g.w, g.h);

      beginSemiClip(g);

      // Círculos concéntricos
      ctx.strokeStyle = 'rgba(100, 181, 246, 0.15)';
      ctx.lineWidth = 1;
      for (let i = 1; i <= 4; i++) {
        ctx.beginPath();
        ctx.arc(g.centerX, g.centerY, (g.radius / 4) * i, Math.PI, 0);
        ctx.stroke();
      }

      // De ángulo radar (0-180) a coords canvas (semicírculo superior)
      function radarAngleToCanvasCoords(radarAngle, radius) {
        const rad = Math.PI - deg2rad(radarAngle);
        const x = Math.cos(rad) * radius;
        const y = -Math.abs(Math.sin(rad)) * radius;
        return { x, y };
      }

      // Líneas radiales
      for (let a = 0; a <= 180; a += 30) {
        const p = radarAngleToCanvasCoords(a, g.radius);
        ctx.beginPath();
        ctx.moveTo(g.centerX, g.centerY);
        ctx.lineTo(g.centerX + p.x, g.centerY + p.y);
        ctx.strokeStyle = a % 90 === 0 ? 'rgba(100, 181, 246, 0.2)' : 'rgba(100, 181, 246, 0.1)';
        ctx.lineWidth = a % 90 === 0 ? 1.5 : 1;
        ctx.stroke();
      }

      // Objetos
      detectedObjects.forEach(o => {
        const dist = Math.min(o.distance, maxDistance);
        const r = (dist / maxDistance) * g.radius;
        const p = radarAngleToCanvasCoords(o.angle, r);
        const x = g.centerX + p.x;
        const y = g.centerY + p.y;

        ctx.beginPath();
        ctx.arc(x, y, 8, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(244, 67, 54, 0.4)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fillStyle = '#f44336';
        ctx.fill();
      });

      // Abanico del barrido
      const sweepLeft = Math.max(0, currentAngle - FAN_WIDTH / 2);
      const sweepRight = Math.min(180, currentAngle + FAN_WIDTH / 2);
      const radarAngleToCanvas = (a) => Math.PI - deg2rad(a);
      const angleLeft = radarAngleToCanvas(sweepLeft);
      const angleRight = radarAngleToCanvas(sweepRight);
      const startAngle = Math.max(angleLeft, angleRight);
      const endAngle = Math.min(angleLeft, angleRight);
      const clampedStart = Math.max(0, Math.min(Math.PI, startAngle));
      const clampedEnd = Math.max(0, Math.min(Math.PI, endAngle));

      const grad = ctx.createRadialGradient(g.centerX, g.centerY, g.radius * 0.1, g.centerX, g.centerY, g.radius);
      grad.addColorStop(0, 'rgba(76, 175, 80, 0.08)');
      grad.addColorStop(0.5, 'rgba(76, 175, 80, 0.04)');
      grad.addColorStop(1, 'rgba(76, 175, 80, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(g.centerX, g.centerY);
      ctx.arc(g.centerX, g.centerY, g.radius, clampedStart, clampedEnd, false);
      ctx.closePath();
      ctx.fill();

      // Línea central
      const b = radarAngleToCanvasCoords(currentAngle, g.radius);
      ctx.beginPath();
      ctx.moveTo(g.centerX, g.centerY);
      ctx.lineTo(g.centerX + b.x, g.centerY + b.y);
      const isAtExtreme = currentAngle <= SWEEP_MIN + 1 || currentAngle >= SWEEP_MAX - 1;
      ctx.strokeStyle = isAtExtreme ? 'rgba(255, 255, 0, 0.8)' : 'rgba(76, 175, 80, 0.6)';
      ctx.lineWidth = isAtExtreme ? 2 : 1.5;
      ctx.stroke();

      endClip();

      // Etiquetas
      ctx.fillStyle = '#9e9e9e';
      ctx.font = '11px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let a = 0; a <= 180; a += 30) {
        const l = radarAngleToCanvasCoords(a, g.radius + 20);
        const lx = g.centerX + l.x;
        const ly = g.centerY + l.y;
        ctx.fillText(`${a}°`, lx, ly);
      }

      wipeUnderBase(g);

      // Movimiento
      currentAngle += scanDirection * SWEEP_STEP;
      if (currentAngle >= SWEEP_MAX) { currentAngle = SWEEP_MAX; scanDirection = -1; }
      else if (currentAngle <= SWEEP_MIN) { currentAngle = SWEEP_MIN; scanDirection = 1; }

      requestAnimationFrame(drawFrame);
    }

    // iniciar radar + tabla
    requestAnimationFrame(drawFrame);
    initTable();       // crea 15 filas fijas

    // ===== Datos
    function addData(angle, distance) {
      const now = new Date();
      const entry = {
        timestamp: now.toLocaleTimeString(),
        angle,
        distance
      };

      // escribir en buffer circular
      ring[writePtr % MAX_ROWS] = entry;
      writePtr++;

      // actualizar puntos del radar
      detectedObjects.unshift({ angle, distance });
      if (detectedObjects.length > 10) detectedObjects.pop();

      // repintar tabla fija
      redrawTable();
    }

    // Demo: agregar datos cada 2s (quitá esto al conectar el sensor real)
    function addSampleData() {
      const angle = Math.floor(Math.random() * 181);
      const distance = Math.floor(Math.random() * 300 + 50);
      addData(angle, distance);
    }
    setInterval(addSampleData, 2000);
  </script>
</body>
</html>
